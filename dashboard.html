<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Painel - Votara</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">V</div>
        <div class="logo-text">
          <span class="logo-name">Votara</span>
          <span class="logo-tag">Painel do Aluno</span>
        </div>
      </a>
      <div class="nav-btns">
        <span id="user-greeting" style="font-size: 0.9rem; margin-right: 1rem; color: var(--txt2);"></span>
        <a href="index.html" class="btn btn-ghost">Vitrine de Projetos</a>
        <a href="#" id="nav-logout-btn" class="btn btn-ghost">Sair</a>
      </div>
    </div>
  </nav>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><a href="#" class="active">📚 Meus Projetos</a></li>
        <li><a href="#">⚙️ Configurações</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <h2 style="font-family: var(--hd); margin-bottom: 0.5rem; font-size: 2rem;">Seus Projetos Adquiridos</h2>
      <p style="color: var(--txt2); margin-bottom: 2.5rem;">Aqui estão as APIs e projetos aos quais você tem acesso.</p>

      <div class="grid" id="my-courses-grid">
        <p style="color: var(--txt2);">Carregando seus projetos...</p>
      </div>
    </main>
  </div>

  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Requer login. Não passamos role específica, assim Admin também pode ver.
      const authData = await window.auth.requireAuth();
      if(!authData) return;

      const user = authData.user;
      document.getElementById('user-greeting').textContent = `Olá, ${user.user_metadata?.full_name || 'Aluno'}!`;

      const grid = document.getElementById('my-courses-grid');

      try {
        // Busca as matrículas do usuário, e junto traz os dados do curso/projeto associado
        const { data: enrollments, error } = await window.client
          .from('enrollments')
          .select(`
            id,
            courses (
              id,
              title,
              description,
              cover_image_path,
              images,
              pdf_file_path,
              api_endpoints,
              readme_content
            )
          `)
          .eq('user_id', user.id);

        if (error) throw error;

        if (!enrollments || enrollments.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem 2rem; background: var(--surface-light); border-radius: var(--r-xl); border: 1px dashed var(--border);">
              <h3 style="margin-bottom: 1rem; color: var(--txt);">Nenhum projeto ainda</h3>
              <p style="color: var(--txt2); margin-bottom: 1.5rem;">Você ainda não possui acesso a nenhum projeto pago.</p>
              <a href="index.html#catalogo" class="btn btn-primary">Ver Projetos Disponíveis</a>
            </div>
          `;
          return;
        }

        grid.innerHTML = '';
        enrollments.forEach(enroll => {
          const course = enroll.courses;
          if(!course) return; // Se o curso foi deletado

          const coverHtml = course.cover_image_path 
            ? `<img src="${course.cover_image_path}" alt="${course.title}">`
            : `<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; background: linear-gradient(135deg, var(--primary-glow), transparent);">🚀</div>`;

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-img">
              ${coverHtml}
            </div>
            <div class="card-body">
              <span class="card-badge" style="background: rgba(37, 211, 102, 0.15); color: var(--wpp);">ACESSO LIBERADO</span>
              <h3 class="card-title">${course.title}</h3>
              <p class="card-desc">${course.description || 'Nenhuma descrição disponível.'}</p>
              
              <div style="margin-top: auto; padding-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
                <button onclick="viewApiDetails('${course.id}')" class="btn btn-ghost btn-block" style="font-size: 0.85rem;">Ver Detalhes / Endpoints</button>
                ${course.pdf_file_path ? `<a href="${course.pdf_file_path}" target="_blank" class="btn btn-ghost btn-block" style="font-size: 0.85rem; border-color: var(--primary); color: var(--primary);">Baixar Arquivos</a>` : ''}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        console.error('Erro ao buscar projetos do usuário:', err);
        grid.innerHTML = '<div style="color: red;">Erro ao carregar seus projetos.</div>';
      }
    });

    // Redireciona para a página de detalhes do projeto
    window.viewApiDetails = function(courseId) {
      window.location.href = `projeto.html?id=${courseId}`;
    };
  </script>
</body>
</html>
