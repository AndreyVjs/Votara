<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes do Projeto — Votara</title>
  <meta name="description" content="Detalhes completos sobre a API selecionada." />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">V</div>
        <div class="logo-text">
          <span class="logo-name">Votara</span>
          <span class="logo-tag">APIs & Projetos</span>
        </div>
      </a>
      <div class="nav-btns">
        <a href="sobre-mim.html" class="btn btn-ghost" style="border-color: transparent;">Sobre Mim</a>
        <a href="index.html" class="btn btn-ghost">Voltar ao Catálogo</a>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top: 2rem; padding-bottom: 5rem;" id="project-container">
    <div style="text-align: center; color: var(--txt2); padding: 5rem;">Carregando dados do projeto...</div>
  </div>

  <!-- FOOTER -->
  <footer style="text-align: center; padding: 2rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--txt2); background: transparent;">
    <p>&copy; 2026 Votara. Todos os direitos reservados.</p>
  </footer>

  <script src="assets/js/supabase.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('project-container');
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id');

      if (!projectId) {
        container.innerHTML = '<div style="text-align: center; color: red; padding: 5rem;">ID do projeto não fornecido. Volte ao catálogo.</div>';
        return;
      }

      try {
        let course = null;

        if (projectId.startsWith('mock_')) {
          const mockDatabase = {
            'mock_1': { 
              title: 'API Sistema de Delivery (Node.js)', 
              description: 'Backend pronto focado em delivery de comida com geolocalização, painel de restaurante e pedidos via WebSockets.',
              cover_image_path: null,
              images: ['🍔', '🛵', '📊'],
              api_endpoints: [
                { method: 'GET', path: '/api/restaurants', description: 'Lista restaurantes com filtro de localização' },
                { method: 'POST', path: '/api/orders', description: 'Cria um novo pedido via WebSocket' }
              ]
            },
            'mock_2': { 
              title: 'SaaS Multi-Tenant (Kotlin)', 
              description: 'Arquitetura base para SaaS corporativo com isolamento de dados, níveis de permissão e cobrança via Stripe integrada.',
              cover_image_path: null,
              images: ['🏢', '💳', '📈'],
              api_endpoints: [
                { method: 'POST', path: '/api/auth/tenant', description: 'Autenticação com isolamento de schema' },
                { method: 'POST', path: '/api/billing/subscribe', description: 'Integração de assinatura Stripe' }
              ]
            },
            'mock_3': { 
              title: 'E-commerce Headless (Java)', 
              description: 'Gestão completa de catálogo, controle de estoque inteligente, carrinho e checkout transparente para qualquer front-end.',
              cover_image_path: null,
              images: ['🛒', '📦', '💳'],
              api_endpoints: [
                { method: 'GET', path: '/api/products', description: 'Catálogo paginado com busca elástica' },
                { method: 'POST', path: '/api/checkout', description: 'Processamento de pagamento transparente' }
              ]
            },
            'mock_mobile': {
              title: 'Aplicativo Mobile de Gestão',
              description: 'Desenvolvimento completo do backend e integração via Kotlin com o Firebase para sincronização em tempo real.',
              cover_image_path: null,
              images: ['📱', '☁️', '⚙️']
            },
            'mock_java': {
              title: 'API REST Corporativa',
              description: 'Criação de uma API em Java com persistência em MySQL para gerenciar um fluxo de dados complexo entre serviços web.',
              cover_image_path: null,
              images: ['💻', '🗄️', '🔒']
            },
            'mock_micro': {
              title: 'Microserviços Híbridos',
              description: 'Modelagem de banco de dados e rotas para conectar plataformas mobile e web em um ecossistema unificado.',
              cover_image_path: null,
              images: ['🌐', '🔗', '🧩']
            }
          };
          course = mockDatabase[projectId];
        } else {
          const { data, error } = await client
            .from('courses')
            .select('*')
            .eq('id', projectId)
            .single();

          if (error) throw error;
          course = data;
        }

        if (!course) throw new Error('Projeto não encontrado');

        // Format gallery
        let galleryHtml = '';
        if (course.images && course.images.length > 0) {
          const mainImg = course.images[0].startsWith('http') 
            ? `<img src="${course.images[0]}" alt="Main">`
            : `<div style="width: 100%; height: 400px; display: flex; align-items: center; justify-content: center; font-size: 5rem; background: linear-gradient(135deg, var(--primary-glow), rgba(12, 15, 20, 0.8));">${course.images[0]}</div>`;
            
          let thumbsHtml = '';
          for (let i = 1; i < course.images.length; i++) {
            const thumb = course.images[i].startsWith('http')
              ? `<img src="${course.images[i]}" alt="Thumb">`
              : `<div style="width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 3rem; background: linear-gradient(135deg, rgba(218, 165, 32, 0.1), rgba(12, 15, 20, 0.8));">${course.images[i]}</div>`;
            thumbsHtml += `<div class="thumb-img">${thumb}</div>`;
          }
          
          galleryHtml = `
            <div class="project-gallery">
              <div class="main-img">${mainImg}</div>
              ${thumbsHtml}
            </div>
          `;
        } else {
          const coverHtml = course.cover_image_path 
            ? `<img src="${course.cover_image_path}" alt="${course.title}">`
            : `<div style="width: 100%; height: 400px; display: flex; align-items: center; justify-content: center; font-size: 5rem; background: linear-gradient(135deg, var(--primary-glow), rgba(12, 15, 20, 0.8));">🚀</div>`;
          galleryHtml = `<div class="project-image-box" style="margin-bottom: 2rem;">${coverHtml}</div>`;
        }

        // Build features + endpoints section
        let featuresHtml = '';
        if (course.features) {
          // Convert line breaks to list items
          const lines = course.features.split('\n').map(l => l.trim()).filter(l => l);
          featuresHtml = '<ul style="color: var(--txt2); line-height: 2; padding-left: 1.5rem;">' +
            lines.map(l => `<li>${l.replace(/^[•\-\*]\s*/, '')}</li>`).join('') +
          '</ul>';
        }

        let endpointsHtml = '';
        if (course.api_endpoints && course.api_endpoints.length > 0) {
          endpointsHtml = '<div style="margin-top: 1.5rem;"><h4 style="font-family: var(--hd); font-size: 1rem; color: var(--primary); margin-bottom: 1rem;">Rotas da API</h4>' +
            course.api_endpoints.map(ep => `
              <div style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: var(--r-md); border: 1px solid var(--border); margin-bottom: 0.5rem; font-family: monospace;">
                <span style="color: var(--primary); font-weight: bold;">${ep.method}</span> ${ep.path}
                <p style="font-family: var(--bd); font-size: 0.85rem; color: var(--txt2); margin-top: 0.5rem; margin-bottom: 0;">${ep.description}</p>
              </div>`
            ).join('') + '</div>';
        }

        // If neither features nor endpoints, fallback
        if (!featuresHtml && !endpointsHtml) {
          featuresHtml = `
            <ul style="color: var(--txt2); line-height: 2; margin-left: 1.5rem;">
              <li>Arquitetura limpa e escalável</li>
              <li>Pronto para integração com Frontend Web/Mobile</li>
              <li>Banco de dados estruturado e validado</li>
            </ul>`;
        }

        // TikTok URL — use real DB value for real projects, fallback '#' for mocks
        const tiktokHref = course.tiktok_url || '#';

        container.innerHTML = `
          <div class="project-details-layout">
            
            <!-- ESQUERDA: Fotos e Funcionalidades -->
            <div class="project-main">
              <!-- Galeria -->
              ${galleryHtml}
              
              <div style="background: var(--glass); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 2.5rem;">
                <h3 style="font-family: var(--hd); font-size: 1.5rem; margin-bottom: 1.5rem;">Funcionalidades &amp; Endpoints</h3>
                ${featuresHtml}
                ${endpointsHtml}
              </div>
            </div>

            <!-- DIREITA: Sidebar Fixa (Venda) -->
            <div class="project-sidebar-container">
              <div class="project-sidebar">
                <span style="background: rgba(218, 165, 32, 0.15); color: var(--primary); padding: 0.3rem 0.8rem; border-radius: var(--r-full); font-size: 0.75rem; font-weight: bold; margin-bottom: 1rem; display: inline-block;">SOBRE A API</span>
                <h1 style="font-family: var(--hd); font-size: 2rem; line-height: 1.2; margin-bottom: 1rem;">${course.title}</h1>
                <p style="color: var(--txt2); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
                  ${course.description || 'Um projeto robusto para acelerar seu desenvolvimento.'}
                </p>
                
                <hr style="border: none; border-top: 1px solid var(--border); margin-bottom: 2rem;">
                
                <h4 style="font-size: 1.5rem; color: var(--txt); margin-bottom: 0.5rem;">Valor Estimado de Revenda</h4>
                <p style="font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 2rem;">R$ 1.000,00+</p>
                
                <a href="https://wa.me/5599999999999?text=Quero%20adquirir%20a%20API:%20${encodeURIComponent(course.title)}" target="_blank" class="btn btn-wpp" style="width: 100%; padding: 1rem; font-size: 1.1rem; border-radius: var(--r-md); justify-content: center; box-shadow: 0 5px 20px rgba(37, 211, 102, 0.3);">
                  Comprar Código Fonte
                </a>

                <a href="${tiktokHref}" target="_blank" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem; border-radius: var(--r-md); justify-content: center; margin-top: 1rem; background: #111; color: #fff; border-color: #ff0050; box-shadow: 0 5px 15px rgba(255, 0, 80, 0.2);">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 15.68a6.34 6.34 0 0 0 6.27 6.36 6.34 6.34 0 0 0 6.27-6.36V11.53a8.27 8.27 0 0 0 4 1.52V9.6a4.83 4.83 0 0 1-1.95-2.91z"/></svg>
                  Ver Demonstração
                </a>
                
                <p style="text-align: center; color: var(--txt2); font-size: 0.8rem; margin-top: 1.5rem;">Pagamento seguro via WhatsApp / PIX</p>
              </div>
            </div>

          </div>

          <!-- BOTTOM: Copy de Conversão -->
          <div class="conversion-banner">
            <h2>Escale seu negócio vendendo esse sistema!</h2>
            <p>
              Esse é só um exemplo de aplicação validada. Você pode adquirir essa API e desenvolver <strong>várias versões de interface</strong> para clientes de nichos diferentes. Obtenha essa API que você poderá vender por <strong>R$ 1.000 ou mais</strong> em cada projeto fechado!
            </p>
            <p style="color: var(--primary); font-weight: bold; margin-bottom: 0;">
              🎁 BÔNUS: Te mandarei um prompt de geração de um frontend personalizado dessa API como na imagem acima!
            </p>
          </div>
        `;

      } catch (err) {
        console.error('Erro ao carregar projeto:', err);
        container.innerHTML = '<div style="text-align: center; color: red; padding: 5rem;">Erro ao carregar o projeto. Verifique o ID ou sua conexão.</div>';
      }
    });
  </script>
</body>
</html>
